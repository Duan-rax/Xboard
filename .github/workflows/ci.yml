name: CI

on:
  pull_request:
    branches: [master, new-dev]
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  verify:
    name: PHP and Laravel checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo_mysql, pdo_sqlite, redis, zip
          coverage: none

      - name: Validate Composer files
        # The upstream lockfile currently predates composer.json. Keep schema
        # validation, while composer install below remains the dependency check.
        run: composer validate --no-check-publish --no-check-lock

      - name: Restore Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check changed PHP syntax
        run: |
          php -l app/Http/Controllers/V2/Admin/Server/EgressProxyController.php
          php -l app/Models/EgressProxy.php
          php -l app/Services/EgressProxyValidator.php
          php -l app/Services/RouteRuleValidator.php
          php -l app/Services/NodeCapabilityService.php
          php -l database/migrations/2026_10_29_000001_create_egress_proxy_table.php
          php -l database/migrations/2026_10_30_000001_add_structured_fields_to_v2_server_route_table.php
          php -l database/migrations/2026_10_30_000002_add_config_revision_to_v2_server_table.php
          php -l app/Services/ServerService.php
          php -l app/Observers/ServerObserver.php
          php -l app/Observers/ServerRouteObserver.php
          php -l app/WebSocket/NodeEventHandlers.php
          php -l app/Http/Controllers/V2/Admin/Server/RouteController.php
          php -l app/Http/Routes/V2/AdminRoute.php

      - name: Check JavaScript extension
        run: |
          node --check public/assets/egress-admin.js
          node tests/js/egress-menu.test.js
          node --check public/assets/route-admin-adapter.js
          node --check public/assets/route-admin.js
          node tests/js/route-admin.test.js

      - name: Set up Go for egress probe
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tools/egress-probe/go.sum

      - name: Test egress probe
        working-directory: tools/egress-probe
        run: go test ./...

      - name: Run egress configuration test
        run: |
          vendor/bin/phpunit --filter EgressProxyConfigTest tests/Unit/Services/EgressProxyConfigTest.php
          vendor/bin/phpunit --filter EgressProxyValidatorTest tests/Unit/Services/EgressProxyValidatorTest.php
          vendor/bin/phpunit --filter RouteRuleValidatorTest tests/Unit/Services/RouteRuleValidatorTest.php
          vendor/bin/phpunit --filter NodeCapabilityServiceTest tests/Unit/Services/NodeCapabilityServiceTest.php
